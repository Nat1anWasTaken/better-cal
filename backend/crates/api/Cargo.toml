[package]
name = "ccal-api"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "cyculcal"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
judge-proto.workspace = true
diagnostics.workspace = true
ccal-core.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
axum.workspace = true
tower = { workspace = true, features = ["util"] }
tower-http = { workspace = true, features = ["cors"] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
chrono.workspace = true
regex.workspace = true
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
argon2 = { version = "0.5", features = ["std"] }
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
jsonwebtoken = "9"
utoipa = { version = "6", features = ["axum_extras", "uuid", "chrono"] }
utoipa-scalar = { version = "0.4", features = ["axum"] }
utoipa-axum = "0.3"
arc-swap = "1"
clap = { version = "4", features = ["derive", "env"] }
rpassword = "7"
time = "0.3"

[dev-dependencies]
tower = { workspace = true, features = ["util"] }
http-body-util = "0.1"
