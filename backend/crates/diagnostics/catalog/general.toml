# 共用文字與「沒有專屬說明」時的誠實備援卡片。
# 這些內容是內建預設值；擁有者可以在管理介面線上修改。

[texts]
"confidence.confirmed" = "編譯器確認"
"confidence.likely" = "很可能"
"confidence.possible" = "推測，不一定正確"
"precision.near" = "這是編譯器「發現不對勁」的位置。真正的原因常常在它前面一點（例如上一行），請從這裡往前看。"
"precision.approximate" = "這個問題沒有精確的行號，標示的位置是系統依程式內容推測的。"
"fixed_region" = "這個位置在題目提供、不能修改的程式區域內。問題通常來自你填寫的區塊，請先檢查你寫的部分。"
"cascade" = "這可能是上面那個問題引起的連鎖反應。建議先修正最上面那一則，重新執行後再看它還在不在。"
"hidden_test" = "這是隱藏測資，所以不會顯示輸入與預期輸出。試著想想題目允許的特殊情況（例如最小值、最大值、0 或負數）。"
"compare.trim_trailing_whitespace" = "比對方式：逐行比較。每行行尾的空白，以及最後多出來的空白行不影響結果；其他空白、換行與文字都必須一樣。"
"compare.exact" = "比對方式：完全相同。每一個空白與換行都必須跟預期輸出一模一樣。"

[rules."fallback.compile_error"]
title = "編譯器回報了一個錯誤"
what = "編譯器在第 {line} 行附近發現一個錯誤，所以程式還不能執行。系統目前還沒有這種錯誤的專屬說明，下面的建議是通用的檢查方法。"
where = "從第 {line} 行開始看，也看看它的前一行。"
next_steps = [
  "把標示的那一行和前一行慢慢讀一次，確認括號 ( )、大括號 { }、引號 \" \" 都有成對出現。",
  "確認每個指令最後都有分號 ;。",
  "展開「原始訊息」，看編譯器提到了哪個名稱或符號，再回到程式裡找它。",
]
hints = [
  "原始訊息的英文可以這樣讀：expected 是「預期應該出現」，before 是「在…之前」，undeclared 是「沒有宣告」。",
  "如果改了一處之後錯誤變少或位置改變，代表方向是對的。一次只改一個地方，再重新執行。",
  "如果還是看不懂，把原始訊息和你的程式拿去問助教或讀書會夥伴，這是很好的學習機會。",
]

[rules."fallback.warning"]
title = "編譯器給了一個提醒"
what = "程式可以編譯，但編譯器在第 {line} 行提醒你可能有問題。系統目前還沒有這種提醒的專屬說明。"
where = "看第 {line} 行。"
why = "「警告」（warning）不會讓程式無法執行，但常常代表程式的行為跟你想的不一樣。"
next_steps = [
  "展開「原始訊息」，看編譯器提到了哪個變數或寫法。",
  "如果程式答案不對，先回頭處理這個提醒。",
]
hints = [
  "{?option}這個提醒的類別是 {option}。{/option}可以把原始訊息中的關鍵字（例如變數名稱）在程式中找出來，看看它在那一行做了什麼。",
]

[rules."fallback.link_error"]
title = "程式在最後組合時出錯"
what = "程式碼本身編譯完了，但在最後把各部分「組合」成可執行程式時（連結 linking）失敗了。系統目前還沒有這種錯誤的專屬說明。"
where = "這類錯誤沒有行號。通常跟函式的名稱、或缺少的函式有關。"
next_steps = [
  "展開「原始訊息」，找出訊息裡用 ` ' 括起來的名稱。",
  "在程式裡搜尋這個名稱，確認它的拼法、大小寫都一致。",
]
hints = ["確認你呼叫的每個函式都有被定義（有寫出它的內容），而且名字完全相同。"]

[rules."compile.timeout"]
title = "編譯花了太久"
what = "編譯器在時間或記憶體限制內沒有完成編譯。這很少見，通常跟程式非常長或某些特殊寫法有關。"
next_steps = ["確認程式沒有貼上大量重複的內容。", "如果程式很短卻一直出現這個訊息，請通知讀書會的管理者。"]
