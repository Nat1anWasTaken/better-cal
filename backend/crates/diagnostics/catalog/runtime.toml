# 執行期問題與答案比對。這些卡片不會顯示隱藏測資的任何內容。

[rules."run.segfault"]
title = "程式執行時崩潰了（記憶體存取錯誤）"
what = "程式在執行測資 #{test_number} 時被系統強制停止，因為它存取了不允許使用的記憶體（segmentation fault）。{?count}共有 {count} 筆測資發生這個問題。{/count}"
cause = "系統無法從這個訊息確定是哪一行出錯。常見的原因有：陣列的索引超出範圍、scanf 的參數寫錯、使用沒有初始值的變數、或是遞迴沒有結束條件。{?warning_lines}另外，編譯器在第 {warning_lines} 行有提醒，建議先看那些提醒。{/warning_lines}"
why = "每個程式只能使用屬於自己的記憶體。去讀寫不屬於它的位置時，作業系統會立刻停止它。"
next_steps = [
  "{?warning_lines}先處理下方第 {warning_lines} 行的警告。{/warning_lines}{!warning_lines}檢查所有的 scanf：參數有沒有寫對？{/warning_lines}",
  "檢查所有陣列的索引：會不會小於 0，或大於等於陣列長度？",
  "用公開測資或自己的輸入執行，觀察程式在印出哪些內容之後才崩潰，就能縮小範圍。",
]
hints = [
  "在程式中間暫時加上 `printf(\"到這裡了\\n\");`，看看程式崩潰前最後印出的是哪一行。",
  "長度為 N 的陣列，合法的索引是 0 到 N-1。",
]

[rules."run.fpe"]
title = "程式執行時發生算術錯誤"
what = "程式在執行測資 #{test_number} 時，因為算術錯誤被系統停止（SIGFPE）。"
cause = "最常見的原因是整數除以 0，或對 0 取餘數（`% 0`）。"
where = "程式裡所有用到 `/` 和 `%` 的地方。"
why = "整數除以 0 在數學上沒有意義，電腦遇到時會直接停止程式。"
next_steps = ["找出程式中所有的 `/` 和 `%`，想一想右邊的數有沒有可能是 0。", "如果可能是 0，先用 if 檢查。"]
hints = ["除數可能來自輸入。題目的輸入會不會讓它變成 0？"]

[rules."run.abort"]
title = "程式執行時自行中止"
what = "程式在執行測資 #{test_number} 時中止了（SIGABRT）。"
cause = "常見原因是記憶體使用錯誤被函式庫偵測到，例如寫入超過陣列或字串的範圍。"
next_steps = ["檢查陣列和字串的長度：寫入的內容有沒有超過宣告的大小？", "字串的結尾需要一個額外的位置放 `\\0`。"]
hints = ["`char s[5]` 最多只能放 4 個字元的字串。"]

[rules."run.signal"]
title = "程式執行時被系統停止"
what = "程式在執行測資 #{test_number} 時被系統停止（訊號 {signal}）。"
cause = "系統沒有這種狀況的專屬說明，無法確定原因。"
next_steps = ["用公開測資或自己的輸入執行，觀察程式停在哪裡。"]
hints = ["在程式中間暫時加上 printf，可以幫助找出出錯的位置。"]

[rules."run.nonzero_exit"]
title = "程式回傳了錯誤代碼 {exit_code}"
what = "程式在執行測資 #{test_number} 時正常結束了，但 `main` 回傳的值是 {exit_code}，不是 0。"
cause = "評測系統把非 0 的回傳值當作「程式執行失敗」。可能是 `main` 最後寫了 `return 1;`，或程式提早 `return` 了一個非 0 的值。"
where = "`main` 函式裡的所有 `return`。"
why = "`main` 回傳 0 代表「程式成功結束」，其他數字通常代表發生錯誤。"
next_steps = ["檢查 `main` 裡所有的 `return`，在正常情況下應該回傳 0。"]
hints = ["`main` 的最後通常寫 `return 0;`。"]

[rules."run.time_limit"]
title = "程式執行超過時間限制"
what = "程式在測資 #{test_number} 中執行超過 {limit_ms} 毫秒，被系統停止了。{?count}共有 {count} 筆測資發生這個問題。{/count}"
cause = "{?public_passed}公開測資都在時間內答對了，只有隱藏測資超時。隱藏測資的資料量常常比較大，所以比較可能是方法太慢；也可能是某種特殊輸入（例如 0 或負數）讓迴圈停不下來。{/public_passed}{!public_passed}{?while_scanf_line}第 {while_scanf_line} 行的 `while (scanf(...))` 可能在輸入讀完後停不下來，這是很常見的原因。{/while_scanf_line}{!while_scanf_line}{?low_cpu}程式幾乎沒有在運算，卻一直沒有結束，可能是在等待某件不會發生的事。{/low_cpu}{!low_cpu}可能是迴圈的結束條件永遠不會成立（無窮迴圈），也可能是方法太慢、計算量太大。{/low_cpu}{/while_scanf_line}{/public_passed}"
why = "評測時每筆測資都有時間限制。逾時不一定代表無窮迴圈，也可能是演算法需要的計算太多。"
next_steps = [
  "檢查每個迴圈：迴圈裡有沒有讓條件最終變成不成立的變化（例如 `i++`）？",
  "檢查讀取輸入的方式：輸入讀完之後，迴圈會不會停？",
  "如果迴圈都會結束，想一想題目的資料量：重複的次數會不會非常多？",
]
hints = [
  "可以用小一點的自訂輸入執行，看程式會不會結束。",
  "在迴圈裡暫時印出變數的值，觀察它有沒有往結束條件前進。",
]

[rules."run.memory_limit"]
title = "程式使用的記憶體超過限制"
what = "程式在測資 #{test_number} 使用的記憶體超過 {limit_mb} MB，被系統停止了。"
cause = "可能是宣告了非常大的陣列，或是遞迴太深、沒有結束。"
next_steps = ["檢查程式中陣列的大小，是否遠大於題目需要的？", "如果有遞迴，確認它有結束條件。"]
hints = ["`int a[100000000];` 這樣的陣列需要大約 400 MB。"]

[rules."run.output_limit"]
title = "程式輸出太多內容"
what = "程式在測資 #{test_number} 輸出的內容超過允許的量，被系統停止了。"
cause = "最常見的原因是 printf 寫在一個停不下來的迴圈裡。"
next_steps = ["檢查迴圈裡的 printf：迴圈會不會一直重複？", "對照題目，確認輸出的行數是否合理。"]
hints = ["用公開測資執行，看看輸出開頭的內容，可能就能發現哪一行在重複。"]

[rules."judge.wrong_answer"]
title = "輸出和預期答案不同"
what = "程式順利執行完畢，但在測資 #{test_number} 的輸出和預期答案不一樣。{?count}共有 {count} 筆測資答案不同。{/count}"
cause = "{?hidden}這是隱藏測資，所以不會顯示輸入與預期輸出。{?public_passed}公開測資全部答對，只有隱藏測資答錯，通常代表主要做法是對的，只是有特殊情況沒處理到。{/public_passed}{!public_passed}常見原因是沒有考慮到特殊情況，或是輸出格式不同。{/public_passed}{/hidden}{!hidden}請比較下方的「預期輸出」和「你的輸出」，看看哪裡不同。{?also_hidden}另外還有 {also_hidden} 筆隱藏測資也答錯了；修好這筆之後，再想想還有哪些特殊情況。{/also_hidden}{/hidden}"
why = "評測是逐字比對輸出結果，包括數字、文字、空白和換行。"
next_steps = [
  "{?hidden}想一想題目允許的特殊輸入，例如最小值、最大值、0、負數或很大的數，自己用「自訂輸入」試試看。{/hidden}{!hidden}在比較區中找出第一個不同的地方。{/hidden}",
  "檢查輸出格式：題目要求的換行、空白、標點符號是否完全相同？",
]
hints = [
  "整數相除會捨去小數，例如 `7 / 2` 的結果是 3。如果需要小數，至少要有一邊是小數（例如 `7 / 2.0`）。",
  "數字很大時，`int` 可能放不下（大約只能到 21 億），可以考慮 `long long`。",
]

[rules."judge.whitespace_only"]
title = "答案的內容對了，但空白或換行不同"
what = "測資 #{test_number} 的輸出文字和預期答案相同，只有空白或換行的位置不一樣。{?count}共有 {count} 筆測資有這個問題。{/count}"
cause = "這一題要求輸出的空白與換行完全一致。{?hidden}這是隱藏測資，所以不會顯示輸出內容，但可以確定文字本身是對的。{/hidden}{?also_hidden}另外還有 {also_hidden} 筆隱藏測資也有同樣的問題。{/also_hidden}"
next_steps = [
  "{?hidden}對照題目的輸出範例，逐一檢查每個空白和換行。{/hidden}{!hidden}在比較區中，注意標示出來的空白（·）和換行（↵）符號。{/hidden}",
  "檢查 printf 裡的空白和 `\\n` 是否跟題目要求一致。",
  "{?hidden}隱藏測資的資料筆數可能和公開測資不同，例如只有一筆或非常多筆；確認這些情況下空白和換行仍然正確。{/hidden}",
]
hints = ["常見的問題：最後一個數字後面多了空白，或是少了最後的換行 `\\n`。"]

[rules."judge.system_error"]
title = "評測服務暫時發生問題"
what = "這次評測沒有完成，原因是評測服務本身出了問題，不是你的程式有錯。"
next_steps = ["你的程式碼已經保存。請稍等一下，再按「重新評測」或重新提交。", "如果持續發生，請通知讀書會的管理者。"]
