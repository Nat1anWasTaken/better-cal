# 語法：分號、括號、大括號、引號、全形符號。

[rules."syntax.fullwidth_char"]
title = "程式裡有中文輸入法的符號"
what = "第 {line} 行有一個「{char}」。它看起來像程式符號，其實是中文輸入法打出來的全形字元，編譯器看不懂。"
cause = "打程式時輸入法還在中文模式。"
where = "第 {line} 行第 {column} 個字附近。"
why = "C 語言只認得英文（半形）的符號。全形的「{char}」和半形的 `{ascii}` 在電腦裡是完全不同的字，就算看起來很像。"
next_steps = [
  "把輸入法切換到英文模式。",
  "刪掉第 {line} 行的「{char}」，重新打一次。",
  "檢查同一行和附近幾行有沒有其他全形符號，例如（）；，＝。",
]
hints = [
  "全形符號通常看起來比較寬，左右空間比較多。",
  "這裡應該使用的是半形的 `{ascii}`。",
]

[rules."syntax.stray_char"]
title = "程式裡有編譯器不認得的字元"
what = "第 {line} 行有一個編譯器不認得的字元：{char}。"
cause = "可能是不小心打到的符號，或是從網頁、文件複製程式碼時一起帶進來的特殊字元。"
where = "第 {line} 行。"
why = "C 語言只能使用特定的英文字母、數字和符號。其他字元只能出現在 \" \" 字串或註解裡面。"
next_steps = ["把第 {line} 行裡那個字元刪掉。如果看不出來是哪一個，可以把整行刪掉自己重打一次。"]
hints = ["從網頁複製的程式碼，有時候會帶有看不見的特殊空白或彎彎的引號 “ ”。自己用鍵盤重打通常就能解決。"]

[rules."syntax.missing_semicolon"]
title = "指令結尾可能少了分號"
what = "編譯器讀到 `{token}` 時，無法確認前一段指令已經結束。"
cause = "{?prev_line}很可能是第 {prev_line} 行的結尾少了分號 `;`。{/prev_line}{!prev_line}很可能是標示位置前面少了分號 `;`。{/prev_line}"
where = "{?prev_line}先檢查第 {prev_line} 行的最後面。編譯器標示在第 {line} 行，是因為它讀到那裡才發現不對。{/prev_line}{!prev_line}先檢查第 {line} 行、標示位置的前面。{/prev_line}"
why = "C 語言用分號 `;` 表示「這個指令到這裡結束」。換行對編譯器來說不代表結束，所以少了分號時，它會以為下一行還是同一個指令。"
next_steps = [
  "{?prev_line}看第 {prev_line} 行最後面有沒有 `;`。{/prev_line}{!prev_line}看標示位置的前面有沒有 `;`。{/prev_line}",
  "如果那裡已經有分號，再往前檢查括號 ( ) 是否成對。",
]
hints = [
  "大部分的指令都要用 `;` 結尾，例如宣告變數、指定數值、呼叫 printf、return。",
  "但 `if (...)`、`for (...)`、`while (...)` 這種後面接著 `{` 的那一行，結尾不需要分號。",
  "範例（跟你的程式無關）：\n```c\nint total = 0;      // 宣告：要分號\ntotal = total + 5;  // 計算：要分號\nprintf(\"%d\\n\", total);  // 呼叫函式：要分號\n```",
]

[rules."syntax.missing_close_paren"]
title = "括號可能沒有成對"
what = "編譯器在 `{token}` 之前，預期看到右括號 `)`。"
cause = "很可能是這一行的左括號 `(` 比右括號 `)` 多。"
where = "看第 {line} 行，數一數左括號和右括號的數量。"
why = "每一個 `(` 都要有一個對應的 `)`。少了一個，編譯器就不知道括號裡的內容在哪裡結束。"
next_steps = [
  "在第 {line} 行從左往右數：看到 `(` 加一，看到 `)` 減一，最後應該剛好是 0。",
  "很多編輯器在游標放到括號旁時，會標示出對應的另一半，可以利用這個功能。",
]
hints = [
  "呼叫函式時，函式名稱後面的 `(` 要等所有參數寫完才用 `)` 結束。",
  "如果裡面還有其他括號（例如算式 `(a + b)`），外層的 `)` 要放在最後面。",
]

[rules."syntax.missing_open_paren"]
title = "{?keyword}`{keyword}` 後面的條件需要括號{/keyword}{!keyword}這裡可能少了左括號{/keyword}"
what = "編譯器在 `{token}` 之前，預期看到左括號 `(`。"
cause = "{?keyword}很可能是 `{keyword}` 後面的條件沒有用括號包起來。{/keyword}"
where = "第 {line} 行。"
why = "{?keyword}在 C 語言裡，`{keyword}` 的條件一定要寫在一對括號 ( ) 裡面。{/keyword}{!keyword}編譯器預期這裡要有 `(`。{/keyword}"
next_steps = ["檢查第 {line} 行的條件，是否從 `(` 開始、用 `)` 結束。"]
hints = [
  "範例（跟你的程式無關）：\n```c\nif (score >= 60) {\n    printf(\"pass\\n\");\n}\n```",
]

[rules."syntax.unclosed_brace"]
title = "大括號可能沒有成對"
what = "編譯器讀到程式最後面，發現還有區塊沒有結束，也就是有一個 `{` 缺少對應的 `}`。"
cause = "{?open_line}根據縮排，可能是第 {open_line} 行開始的區塊沒有結束。{/open_line}{!open_line}某一個 `{` 沒有對應的 `}`。{/open_line}"
where = "編譯器會標示在程式的最後一行，但缺少 `}` 的地方通常在更前面。{?open_line}建議先從第 {open_line} 行開始看。{/open_line}"
why = "`{` 和 `}` 用來把程式分成一個個區塊（例如函式的內容、迴圈要重複的內容）。每個 `{` 都要有一個 `}` 告訴編譯器區塊在哪裡結束。"
next_steps = [
  "{?open_line}找到第 {open_line} 行的 `{`，確認它包住的內容結束後，有一個對應的 `}`。{/open_line}{!open_line}從上往下，每看到 `{` 就加一，看到 `}` 就減一，最後應該是 0。{/open_line}",
  "注意程式的縮排：同一層的 `}` 通常會和開始那一行對齊。",
]
hints = [
  "迴圈或 if 的 `}` 很常被忘記，尤其是在後面還接著 `return 0;` 的時候。",
  "範例（跟你的程式無關）：\n```c\nint main(void) {\n    for (int i = 0; i < 3; i++) {\n        printf(\"%d\\n\", i);\n    }   // 結束 for\n    return 0;\n}       // 結束 main\n```",
]

[rules."syntax.extra_brace"]
title = "可能多了一個 `}`"
what = "編譯器在函式外面看到了應該寫在函式裡面的程式碼。"
cause = "很可能是第 {close_line} 行附近多了一個 `}`，讓函式提早結束了。"
where = "從第 {close_line} 行的 `}` 開始看。"
why = "`}` 代表一個區塊結束。如果多了一個，後面的程式碼就會被當成「在函式外面」，但 C 語言不允許在函式外面寫 `return` 或 `printf` 這類指令。"
next_steps = [
  "從程式開頭開始數：看到 `{` 加一，看到 `}` 減一。數字在函式真正結束前就變成 0 的地方，就是多出來的 `}`。",
  "對照縮排，看看哪一個 `}` 和它對應的那一行沒有對齊。",
]
hints = ["每一個 `}` 都應該能找到一個在它上面、和它配成一對的 `{`。"]

[rules."syntax.unterminated_string"]
title = "引號沒有成對"
what = "第 {line} 行有一個雙引號 `\"` 開始了一段文字（字串），但同一行裡沒有結束的引號。"
where = "第 {line} 行。"
why = "在 C 語言裡，像 `\"hello\"` 這樣的文字必須用兩個雙引號包起來，而且要在同一行結束。少了結束的引號，編譯器會以為後面的程式碼全部都是文字。"
next_steps = [
  "找到第 {line} 行的雙引號，確認每一段文字都有開頭和結尾的 `\"`。",
  "注意 `\\n` 是「換行」的寫法，它應該在引號「裡面」。",
]
hints = [
  "範例（跟你的程式無關）：`printf(\"Hello\\n\");` 引號包住的是 `Hello\\n`，然後才是 `)` 和 `;`。",
]

[rules."syntax.expected_expression"]
title = "這裡少了一個值或算式"
what = "編譯器在 `{token}` 之前，預期看到一個值或算式（expression），例如數字、變數或計算。"
cause = "可能是運算符號（例如 `+`、`=`）的一邊是空的，或是括號裡什麼都沒有。也可能是前面另一個錯誤造成的連鎖反應。"
where = "第 {line} 行，以及它的前一行。"
why = "像 `a = ;` 或 `x + ` 這樣的寫法不完整，編譯器不知道要用什麼值。"
next_steps = ["檢查標示位置附近，每個運算符號兩邊是否都有東西。", "如果這附近還有其他錯誤，先修最上面的那一個。"]
hints = ["引號或括號沒有成對時，也常常會出現這個訊息。"]

[rules."syntax.unexpected_token"]
title = "編譯器在這裡看不懂程式的結構"
what = "編譯器讀到 `{token}` 時，發現程式的結構跟它預期的不一樣。"
cause = "常見原因包括：前一行少了分號、括號沒有成對、關鍵字拼錯，或是用了中文標點符號。"
where = "從第 {line} 行往前看，特別是前一行的結尾。"
why = "編譯器是照著固定的文法一個字一個字讀程式的。前面少了東西時，它常常要讀到後面才會發現。"
next_steps = [
  "檢查前一行結尾有沒有分號。",
  "檢查這一行的括號 ( ) 是否成對、有沒有全形符號。",
  "確認關鍵字（例如 `int`、`return`）拼寫正確。",
]
hints = ["展開原始訊息：`expected X before Y` 的意思是「在 Y 之前，預期看到 X」。"]
